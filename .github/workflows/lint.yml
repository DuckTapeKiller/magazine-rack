name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Obsidian's lint must always be the newest release: the community
      # review runs the current rules, so an older plugin here would let
      # through what the review then reports.
      - name: Obsidian lint plugin is the latest release
        run: |
          installed=$(node -p "require('eslint-plugin-obsidianmd/package.json').version")
          latest=$(npm view eslint-plugin-obsidianmd version)
          echo "eslint-plugin-obsidianmd: installed $installed, latest $latest"
          if [ "$installed" != "$latest" ]; then
            echo "::error::eslint-plugin-obsidianmd $installed is behind $latest. Update it (npm install -D eslint-plugin-obsidianmd@latest), then fix what the new rules report."
            exit 1
          fi

      # Obsidian's official plugin lint on every file and the type check;
      # any error or warning fails the run.
      - name: Type check
        run: npx tsc -noEmit -skipLibCheck

      - name: Lint (official Obsidian rules)
        run: npx eslint . --max-warnings=0

      # The review also checks styles.css against the Chromium of the oldest
      # Obsidian the manifest allows (1.4.x: Chrome 114) and reports :has.
      - name: Lint CSS (browser support, as the review checks it)
        run: npx stylelint styles.css --max-warnings=0
